databases:
  - name: salus-db
    plan: free
    databaseName: salus
    user: salus

services:
  - type: web
    name: salus-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: sh start.sh
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: DJANGO_DEBUG
        value: "0"
      - key: SALUS_DEMO_MODE
        value: "1"
      - key: SALUS_SEED_ON_START
        value: "1"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SALUS_HASH_SALT
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: salus-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: salus-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: bash build_render.sh
    staticPublishPath: build/web
    envVars:
      - key: API_BASE
        value: https://salus-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
