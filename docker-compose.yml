services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salus
      POSTGRES_USER: salus
      POSTGRES_PASSWORD: salus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salus -d salus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://salus:salus@db:5432/salus
      DJANGO_DEBUG: "1"
      SALUS_DEMO_MODE: "1"
      SALUS_SEED_ON_START: "1"
      DJANGO_SECRET_KEY: salus-compose-dev-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      SALUS_HASH_SALT: salus-compose-salt
      CORS_ALLOW_ALL_ORIGINS: "1"
      GUNICORN_WORKERS: "1"
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
