server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /app {
        return 302 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
